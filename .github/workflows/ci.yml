name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp verify

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `run` starts certs and server first (depends_on) and returns the client's exit code.
      - run: docker compose run --build --rm client
      - if: failure()
        run: docker compose logs server
